services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////srv/data/loans.db
      SIS_BASE_URL: http://mock-sis:8001
      SEED_DEFAULT_FUND: "1"
    volumes:
      - loans-data:/srv/data
    depends_on:
      - mock-sis

  mock-sis:
    build: .
    command: ["uvicorn", "mock_sis.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"

volumes:
  loans-data:
